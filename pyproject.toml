[project]
name = "module-4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = [
    "alembic>=1.18.5",
    "automium-web>=0.1.1",
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pyrefly>=0.60.0",
    "pytest>=9.1.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
]

# DeepSeek v4: pytest only looks in tests/ and skips data/.venv
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["data", ".venv"]
